name: Experimental NVRMFB HiDPI build
on:
  push:
    branches: ['research/nvrmfb-hidpi-204']
    paths: ['display-research/**', '.github/workflows/build-framebuffer-hidpi.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: nullmoth/nvidia-macos-driver
          ref: b737dedc11fa4edbcb4abe8d51e94cebfed21ac6
          path: upstream
      - uses: actions/checkout@v4
        with:
          repository: NVIDIA/open-gpu-kernel-modules
          ref: e4a5faa2567f28c8eabe0ebb6422b6d0abcf37eb
          path: ogkm
      - name: Build stock framebuffer first
        run: |
          set -o pipefail
          bash display-research/build_framebuffer.sh upstream ogkm stock 2>&1 | tee stock-build.log
      - name: Apply experiment and build
        run: |
          set -o pipefail
          python3 display-research/prepare_hidpi.py upstream
          bash display-research/build_framebuffer.sh upstream ogkm experiment 2>&1 | tee experiment-build.log
      - name: Check symbols and package
        run: |
          set -euo pipefail
          nm -u stock/NVRMFB.kext/Contents/MacOS/NVRMFB | sort > stock-undefined.txt
          nm -u experiment/NVRMFB.kext/Contents/MacOS/NVRMFB | sort > experiment-undefined.txt
          diff -u stock-undefined.txt experiment-undefined.txt
          strings experiment/NVRMFB.kext/Contents/MacOS/NVRMFB | grep -F 'nvfbhidpi'
          mkdir -p artifact
          ditto -c -k --sequesterRsrc --keepParent experiment/NVRMFB.kext artifact/NVRMFB-2.0.4-hidpi-experimental.zip
          cp display-research/README.md NVRMFB-hidpi.patch artifact/
          shasum -a 256 artifact/NVRMFB-2.0.4-hidpi-experimental.zip > artifact/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: NVRMFB-2.0.4-hidpi-experimental
          path: artifact/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NVRMFB-build-logs
          path: |
            *-build.log
            *-undefined.txt
